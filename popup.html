<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #1f2937;
    }
    h3 {
      margin: 16px 0 8px 0;
      font-size: 14px;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section {
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
      min-height: 60px;
    }
    .preferred-area { border-color: #22c55e; }
    .company-area { border-color: #3b82f6; }
    .warning-area { border-color: #fbbf24; }
    .blocked-area { border-color: #ef4444; }
    
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      font-weight: 500;
    }
    button:hover {
      background-color: #2563eb;
    }
    .help-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    .status.success {
      background-color: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <h2>Job Listing Highlighter</h2>
  
  <div class="section">
    <h3><span style="color: #22c55e;">✓</span> Preferred Sites</h3>
    <textarea id="preferred" class="preferred-area" placeholder="greenhouse.io&#10;lever.co&#10;ashbyhq.com"></textarea>
    <div class="help-text">Green highlight - Easy application process</div>
  </div>

  <div class="section">
    <h3><span style="color: #3b82f6;">🏢</span> Company Pages</h3>
    <textarea id="company" class="company-area" placeholder="careers&#10;jobs&#10;apply"></textarea>
    <div class="help-text">Blue highlight - Direct company career pages</div>
  </div>

  <div class="section">
    <h3><span style="color: #fbbf24;">⚠️</span> Warning Sites</h3>
    <textarea id="warning" class="warning-area" placeholder="myworkdayjobs.com&#10;successfactors.com"></textarea>
    <div class="help-text">Yellow highlight - Tedious application process</div>
  </div>

  <div class="section">
    <h3><span style="color: #ef4444;">🚫</span> Blocked Sites</h3>
    <textarea id="blocked" class="blocked-area" placeholder="example-bad-ats.com"></textarea>
    <div class="help-text">Red highlight - Sites to avoid</div>
  </div>

  <button id="save">Save Settings</button>
  <button id="reset" style="background-color: #6b7280; margin-top: 8px;">Reset to Defaults</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
